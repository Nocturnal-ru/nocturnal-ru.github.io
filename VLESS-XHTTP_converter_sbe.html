<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VLESS XHTTP → sing-box-extended Converter</title>
    <style>
        :root {
            color-scheme: light;
            --page: #eef2f7;
            --card: #ffffff;
            --panel: #f7f9fc;
            --border: #d7dee8;
            --text: #172033;
            --muted: #5c687a;
            --accent: #1769e0;
            --accent-hover: #0f56bd;
            --danger: #c93434;
            --output: #172033;
            --output-border: #26334b;
            --output-text: #e9eef7;
            --key: #8bd5ca;
            --string: #f5c2a0;
            --number: #a6da95;
            --boolean: #8aadf4;
            --shadow: 0 12px 36px rgba(36, 48, 72, 0.10);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 32px 16px;
            background: var(--page);
            color: var(--text);
            font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            font-size: 16px;
            line-height: 1.45;
        }

        .container {
            width: min(980px, 100%);
            margin: 0 auto;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: var(--shadow);
            padding: 28px;
        }

        h1 {
            margin: 0 0 6px;
            font-size: 1.45rem;
            line-height: 1.2;
        }

        .subtitle {
            margin: 0 0 22px;
            color: var(--muted);
            font-size: 0.95rem;
        }

        .field-label {
            display: block;
            margin: 0 0 7px;
            font-weight: 650;
            font-size: 0.92rem;
        }

        textarea,
        .control-input {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #fff;
            color: var(--text);
            outline: none;
            transition: border-color .15s, box-shadow .15s;
        }

        textarea {
            min-height: 118px;
            resize: vertical;
            padding: 12px 13px;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
            font-size: 0.92rem;
            line-height: 1.5;
        }

        textarea:focus,
        .control-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(23, 105, 224, 0.12);
        }

        .settings-panel {
            margin-top: 18px;
            padding: 18px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
        }

        .settings-panel h2 {
            margin: 0 0 14px;
            font-size: 1rem;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px 16px;
        }

        .setting {
            min-width: 0;
        }

        .setting.full {
            grid-column: 1 / -1;
        }

        .setting label,
        .setting-title {
            display: block;
            margin-bottom: 6px;
            color: #344056;
            font-size: 0.86rem;
            font-weight: 650;
        }

        .control-input {
            padding: 9px 10px;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
            font-size: 0.9rem;
        }

        .radio-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 20px;
            min-height: 38px;
            align-items: center;
        }

        .radio-label {
            display: inline-flex !important;
            align-items: center;
            gap: 7px;
            margin: 0 !important;
            color: var(--text) !important;
            font-weight: 500 !important;
            cursor: pointer;
        }

        .radio-label input {
            accent-color: var(--accent);
        }

        .hint {
            margin-top: 6px;
            color: var(--muted);
            font-size: 0.81rem;
        }

        .actions {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 12px;
            margin: 20px 0;
        }

        button {
            appearance: none;
            border: 0;
            border-radius: 9px;
            padding: 12px 18px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            transition: background .15s, transform .05s, border-color .15s;
        }

        button:active {
            transform: translateY(1px);
        }

        .primary-btn {
            min-height: 48px;
            background: var(--accent);
            color: #fff;
        }

        .primary-btn:hover {
            background: var(--accent-hover);
        }

        .secondary-btn {
            min-height: 48px;
            background: #fff;
            color: #344056;
            border: 1px solid var(--border);
        }

        .secondary-btn:hover {
            background: #f4f6f9;
            border-color: #bec8d6;
        }

        .output-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 8px;
        }

        .output-header h2 {
            margin: 0;
            font-size: 1rem;
        }

        .copy-btn {
            min-width: 180px;
            min-height: 44px;
            padding: 10px 18px;
            background: #0b7a53;
            color: #fff;
            font-size: 0.95rem;
        }

        .copy-btn:hover {
            background: #086542;
        }

        pre {
            width: 100%;
            min-height: 360px;
            max-height: 600px;
            margin: 0;
            padding: 16px;
            overflow: auto;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            border: 1px solid var(--output-border);
            border-radius: 9px;
            background: var(--output);
            color: var(--output-text);
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
            font-size: 0.91rem;
            line-height: 1.55;
        }

        pre .key { color: var(--key); }
        pre .string { color: var(--string); }
        pre .number { color: var(--number); }
        pre .boolean { color: var(--boolean); }

        .error {
            color: #ff9f9f;
        }

        @media (max-width: 700px) {
            body { padding: 14px 10px; }
            .container { padding: 18px; border-radius: 10px; }
            .settings-grid { grid-template-columns: 1fr; }
            .setting.full { grid-column: auto; }
            .actions { grid-template-columns: 1fr; }
            .output-header { align-items: stretch; flex-direction: column; }
            .copy-btn { width: 100%; }
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>VLESS XHTTP → sing-box-extended</h1>
        <p class="subtitle">Конвертер ссылки 3x-ui в outbound для sing-box-extended / Podkop.</p>

        <label class="field-label" for="urlInput">VLESS-ссылка из 3x-ui</label>
        <textarea id="urlInput" placeholder="Вставьте vless://..."></textarea>

        <section class="settings-panel">
            <h2>Параметры XHTTP / xmux</h2>

            <div class="settings-grid">
                <div class="setting">
                    <label for="xPaddingBytes">x_padding_bytes</label>
                    <input class="control-input" id="xPaddingBytes" value="100-1000">
                </div>

                <div class="setting">
                    <span class="setting-title">support_x25519mlkem768</span>
                    <div class="radio-row">
                        <label class="radio-label">
                            <input type="radio" name="mlkemSupport" value="true" checked>
                            Включено
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="mlkemSupport" value="false">
                            Выключено
                        </label>
                    </div>
                    <div class="hint">Для Reality. Xray &gt; 26.7.28 требует наличия этого параметра.</div>
                </div>

                <div class="setting full">
                    <span class="setting-title">Режим ограничения xmux</span>
                    <div class="radio-row">
                        <label class="radio-label">
                            <input type="radio" name="xmuxMode" value="max_connections" checked onchange="switchXmuxMode(this.value)">
                            max_connections
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="xmuxMode" value="max_concurrency" onchange="switchXmuxMode(this.value)">
                            max_concurrency
                        </label>
                    </div>
                    <input class="control-input" id="xmuxModeValue" type="number" min="1" value="2">
                </div>

                <div class="setting">
                    <label for="c_max_reuse_times">c_max_reuse_times</label>
                    <input class="control-input" id="c_max_reuse_times" type="number" value="0">
                </div>

                <div class="setting">
                    <label for="h_max_request_times">h_max_request_times</label>
                    <input class="control-input" id="h_max_request_times" value="600-900">
                </div>

                <div class="setting">
                    <label for="h_max_reusable_secs">h_max_reusable_secs</label>
                    <input class="control-input" id="h_max_reusable_secs" value="1800-3000">
                </div>
            </div>
        </section>

        <div class="actions">
            <button class="primary-btn" type="button" onclick="convertURL()">Получить JSON</button>
            <button class="secondary-btn" type="button" onclick="clearForm()">Очистить форму</button>
        </div>

        <div class="output-header">
            <h2>Готовый JSON</h2>
            <button class="copy-btn" id="copyButton" type="button" onclick="copyJSON()">Копировать JSON</button>
        </div>

        <pre id="jsonOutput"></pre>
    </main>

    <script>
        let lastGeneratedJson = '';

        function convertURL() {
            const urlInput = document.getElementById('urlInput').value.trim();
            const outputElement = document.getElementById('jsonOutput');

            lastGeneratedJson = '';

            if (!urlInput.startsWith('vless://')) {
                showError('Ошибка: ссылка должна начинаться с vless://');
                return;
            }

            try {
                const url = new URL(urlInput);
                const params = new URLSearchParams(url.search);

                const uuid = url.username;
                const originalServer = url.hostname;
                const port = parseInt(url.port, 10) || 443;
                const tag = url.hash ? decodeURIComponent(url.hash.substring(1)) : 'VLESS-XHTTP';

                const type = params.get('type') || 'xhttp';
                const path = params.get('path') || '/';
                const mode = params.get('mode') || 'auto';
                const sni = params.get('sni') || '';
                const host = params.get('host') || sni;

                const security = params.get('security');
                const isReality = security === 'reality';
                const isTls = security === 'tls';

                const pbk = params.get('pbk') || '';
                const sid = params.get('sid') || '';
                const fp = params.get('fp') || 'chrome';

                const server = resolveServer(originalServer, host, sni);
                if (!server) {
                    showError('Ошибка: в ссылке указан localhost, но отсутствуют host и sni для определения реального адреса сервера.');
                    return;
                }

                let alpnValue;
                const alpnRaw = params.get('alpn');
                if (alpnRaw) {
                    const alpnParsed = decodeURIComponent(alpnRaw).split(',');
                    alpnValue = alpnParsed.length === 1 ? alpnParsed[0] : alpnParsed;
                } else {
                    alpnValue = type === 'xhttp' ? 'h2' : [];
                }

                const xPaddingBytes = document.getElementById('xPaddingBytes').value.trim();
                const xmuxMode = document.querySelector('input[name="xmuxMode"]:checked').value;
                const xmuxModeValue = document.getElementById('xmuxModeValue').value.trim();
                const cMaxReuseTimes = parseInt(document.getElementById('c_max_reuse_times').value, 10);
                const hMaxRequestTimes = document.getElementById('h_max_request_times').value.trim();
                const hMaxReusableSecs = document.getElementById('h_max_reusable_secs').value.trim();
                const mlkemSupport = document.querySelector('input[name="mlkemSupport"]:checked').value === 'true';

                const tlsSettings = {
                    enabled: true,
                    server_name: sni,
                    alpn: alpnValue
                };

                if (isReality) {
                    tlsSettings.reality = {
                        enabled: true,
                        public_key: pbk,
                        short_id: sid,
                        support_x25519mlkem768: mlkemSupport
                    };
                    tlsSettings.utls = {
                        enabled: true,
                        fingerprint: fp
                    };
                } else if (isTls) {
                    if (params.has('allowInsecure')) {
                        tlsSettings.insecure = params.get('allowInsecure') === '1';
                    }
                    if (params.has('fp')) {
                        tlsSettings.utls = {
                            enabled: true,
                            fingerprint: fp
                        };
                    }
                }

                const transport = {
                    type: type,
                    path: path,
                    host: host,
                    mode: mode,
                    x_padding_bytes: xPaddingBytes
                };

                if (mode === 'stream-up' || mode === 'stream-one') {
                    transport.no_grpc_header = false;
                }

                const xmux = {};
                if (xmuxMode === 'max_connections') {
                    const maxConnections = parseInt(xmuxModeValue, 10);
                    if (!Number.isFinite(maxConnections) || maxConnections < 1) {
                        showError('Ошибка: max_connections должен быть целым числом не меньше 1.');
                        return;
                    }
                    xmux.max_connections = maxConnections;
                } else {
                    xmux.max_concurrency = xmuxModeValue;
                }

                xmux.c_max_reuse_times = Number.isFinite(cMaxReuseTimes) ? cMaxReuseTimes : 0;
                xmux.h_max_request_times = hMaxRequestTimes;
                xmux.h_max_reusable_secs = hMaxReusableSecs;
                transport.xmux = xmux;

                const config = {
                    type: 'vless',
                    tag: tag,
                    server: server,
                    server_port: port,
                    uuid: uuid,
                    flow: '',
                    tls: tlsSettings,
                    transport: transport
                };

                lastGeneratedJson = JSON.stringify(config, null, 2);
                outputElement.innerHTML = syntaxHighlight(lastGeneratedJson);
            } catch (e) {
                showError('Ошибка парсинга: ' + e.message);
            }
        }

        function resolveServer(originalServer, host, sni) {
            const normalized = originalServer.toLowerCase();
            const localPanelHosts = new Set(['localhost', '127.0.0.1', '::1', '[::1]']);

            if (!localPanelHosts.has(normalized)) {
                return originalServer;
            }

            return host || sni || '';
        }

        function switchXmuxMode(mode) {
            const input = document.getElementById('xmuxModeValue');
            if (mode === 'max_connections') {
                input.type = 'number';
                input.min = '1';
                input.value = '2';
            } else {
                input.type = 'text';
                input.removeAttribute('min');
                input.value = '16-32';
            }
        }

        function clearForm() {
            document.getElementById('urlInput').value = '';
            document.getElementById('xPaddingBytes').value = '100-1000';

            document.querySelector('input[name="mlkemSupport"][value="true"]').checked = true;
            document.querySelector('input[name="xmuxMode"][value="max_connections"]').checked = true;

            const xmuxValue = document.getElementById('xmuxModeValue');
            xmuxValue.type = 'number';
            xmuxValue.min = '1';
            xmuxValue.value = '2';

            document.getElementById('c_max_reuse_times').value = '0';
            document.getElementById('h_max_request_times').value = '600-900';
            document.getElementById('h_max_reusable_secs').value = '1800-3000';
            document.getElementById('jsonOutput').textContent = '';

            lastGeneratedJson = '';
            resetCopyButton();
            document.getElementById('urlInput').focus();
        }

        function copyJSON() {
            if (!lastGeneratedJson) {
                showCopyState('Нет JSON');
                return;
            }

            navigator.clipboard.writeText(lastGeneratedJson)
                .then(() => showCopyState('Скопировано'))
                .catch(() => showCopyState('Ошибка копирования'));
        }

        function showCopyState(text) {
            const button = document.getElementById('copyButton');
            button.textContent = text;
            window.setTimeout(resetCopyButton, 1400);
        }

        function resetCopyButton() {
            document.getElementById('copyButton').textContent = 'Копировать JSON';
        }

        function showError(message) {
            lastGeneratedJson = '';
            document.getElementById('jsonOutput').innerHTML =
                '<span class="error">' + escapeHtml(message) + '</span>';
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function syntaxHighlight(json) {
            json = json
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');

            return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
                let cls = 'number';
                if (/^"/.test(match)) {
                    cls = /:$/.test(match) ? 'key' : 'string';
                } else if (/true|false/.test(match)) {
                    cls = 'boolean';
                }
                return '<span class="' + cls + '">' + match + '</span>';
            });
        }
    </script>
</body>
</html>
